# hobby-service: Deployment (keeps the pod running) + Service (stable name "hobby-service:8000").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hobby-service
  namespace: kairos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hobby-service
  template:
    metadata:
      labels:
        app: hobby-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the image's "kairos" user; numeric so Kubernetes can verify non-root
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hobby-service
          image: ghcr.io/tanishcq/kairos-hobby-service:sha-ce6b7b6
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: kairos-env, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: kairos-env, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: kairos-env, key: POSTGRES_DB }
            # $(VAR) is filled in by Kubernetes from the variables defined above it.
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: kairos-env, key: JWT_SECRET }
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Keep serving for 5 s after the pod is marked for removal, so routing updates
          # everywhere before Uvicorn stops (avoids 502s during rollouts).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hobby-service
  namespace: kairos
spec:
  selector:
    app: hobby-service
  ports:
    - name: http
      port: 8000
      targetPort: http
