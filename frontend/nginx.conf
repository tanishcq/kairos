# Kairos frontend: serves the static page and proxies /api/* to the backend services.
# Backend names (user-service, ...) are Compose DNS names; Kubernetes will provide the same.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Browser hardening. CSP 'self' only allows our own scripts and styles (no inline code).
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Passed to the services so they can see the original request.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        try_files $uri $uri/ =404;
    }

    # Health check for Docker/Kubernetes, answered by Nginx itself.
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # /api/<path> -> <service>:8000/<path> (the /api prefix is stripped).
    location /api/hobbies  { proxy_pass http://hobby-service:8000/hobbies; }
    location /api/sessions { proxy_pass http://session-service:8000/sessions; }
    location /api/users    { proxy_pass http://user-service:8000/users; }
    location = /api/login  { proxy_pass http://user-service:8000/login; }
    location = /api/me     { proxy_pass http://user-service:8000/me; }
}
